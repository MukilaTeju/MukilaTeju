<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connectors Incentives Payout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF6B00; --orange-soft:#FFF1E6; --green:#1E9E57; --green-bright:#2ECC71; --green-soft:#E9F9F0;
  --ink:#1D1D1F; --muted:#6B6B70; --line:#E6E3DF; --red:#C8321E; --red-soft:#FDEDEA; --bg:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:0 18px 40px}
header{background:var(--orange);color:#fff}
header .wrap{padding-top:22px;padding-bottom:20px}
.brand{font-weight:600;font-size:15px;opacity:.92;margin:0}
h1{font-size:28px;line-height:1.1;margin:4px 0 6px;font-weight:700;letter-spacing:-.01em}
.period{margin:0;font-size:15px;opacity:.95}
section{margin-top:24px}
.q{font-size:18px;font-weight:600;margin:0 0 10px}
.cities{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.city{appearance:none;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 0 9px;font:inherit;font-weight:700;font-size:17px;color:var(--ink);cursor:pointer}
.city small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
.city[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft);color:#B84A00}
.city[aria-pressed="true"] small{color:#B84A00}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:600;letter-spacing:.04em;padding:12px 14px;border:2px solid var(--line);border-radius:12px;color:var(--ink)}
input:focus{outline:none;border-color:var(--orange)}
.go{appearance:none;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:600;font-size:17px;padding:0 20px;border-radius:12px;cursor:pointer}
.go:disabled{background:#BDBDC2;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #1A73E8;outline-offset:2px}
.msg{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--red-soft);color:var(--red);font-size:16px}
.msg[hidden],#result[hidden]{display:none}
/* pay slip */
#result{margin-top:26px}
.slip{border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.who{padding:16px 18px 12px}
.who h2{margin:0;font-size:23px;line-height:1.15}
.who p{margin:2px 0 0;color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:10px 12px;border-right:1px solid var(--line)}
.stat:nth-child(3n){border-right:0}
.stat:nth-child(n+4){border-top:1px solid var(--line)}
.stat:nth-child(5){grid-column:span 2;border-right:0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.2;display:block}
.lines{list-style:none;margin:0;padding:6px 18px}
.lines li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:16px}
.lines li:last-child{border-bottom:0}
.lines .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.lines li.zero{color:var(--muted)}
.lines li.zero .amt{font-weight:400}
.lines li.minus .amt{color:var(--red)}
.total{background:var(--green-soft);border-top:2px solid var(--ink);padding:14px 18px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total span{font-weight:600;font-size:17px}
.total b{font-size:34px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.again{margin-top:14px;appearance:none;border:0;background:none;color:#B84A00;font:inherit;font-weight:600;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
footer{margin-top:30px;color:var(--muted);font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.slip.show{animation:in .28s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media (max-width:360px){.city{font-size:15px}.city small{font-size:10.5px}.total b{font-size:28px}}
</style>
</head>

var CITY_NAMES = {BLR:"Bengaluru",NCR:"Delhi NCR",MUM:"Mumbai",HYD:"Hyderabad",PNQ:"Pune"};
// row: [name, hub, workingDays, trips, onTimePct, mgDays, doubleMgDays, tripsPayout, km, onTime, attendance, airport, penalty, final]
document.addEventListener("DOMContentLoaded", function () {
  var city = null;
  var citiesEl = document.getElementById("cities");
  var emp = document.getElementById("emp");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var result = document.getElementById("result");
  document.getElementById("period").textContent = PERIOD;

  function cleanId(v){ return String(v).replace(/[,\s]/g, ""); }
  function rs(v){ var n = Number(String(v).replace(/,/g, "")) || 0; return "\u20B9" + Math.abs(n).toLocaleString("en-IN"); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function refresh(){ go.disabled = !(city && cleanId(emp.value)); }
  function showMsg(t){ msg.textContent = t; msg.hidden = false; result.hidden = true; }

  Object.keys(DATA).forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "city"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = esc(c) + "<small>" + esc(CITY_NAMES[c] || c) + "</small>";
    b.addEventListener("click", function () {
      city = c;
      Array.prototype.forEach.call(citiesEl.children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      msg.hidden = true; refresh(); emp.focus();
    });
    citiesEl.appendChild(b);
  });

  emp.addEventListener("input", function(){ msg.hidden = true; refresh(); });
  emp.addEventListener("keydown", function (e) { if (e.key === "Enter" && !go.disabled) search(); });
  go.addEventListener("click", search);

  function search() {
    var id = cleanId(emp.value);
    var r = DATA[city] && DATA[city][id];
    if (!r) {
      var other = Object.keys(DATA).filter(function (c) { return DATA[c][id]; })[0];
      if (other) showMsg("Emp ID " + id + " is listed under " + other + ", not " + city + ". Tap " + other + " and try again.");
      else showMsg("No payout found for Emp ID " + id + " in " + city + ". Check the ID and try again, or ask your city lead.");
      return;
    }
    msg.hidden = true;
    var lines = [
      ["Trips payout", r[7]],
      ["KM incentive", r[8]],
      ["On-time incentive", r[9]],
      ["On-time attendance", r[10]],
      ["Airport / NABL duty / B2C rounds / Camp duty", r[11]]
    ];
    var li = lines.map(function (l) {
      var n = Number(l[1]) || 0;
      return '<li class="' + (n === 0 ? "zero" : "") + '"><span>' + esc(l[0]) + '</span><span class="amt">' + (n < 0 ? "\u2212 " : "") + rs(n) + "</span></li>";
    }).join("");
    if (Number(r[12])) li += '<li class="minus"><span>Penalty</span><span class="amt">\u2212 ' + rs(r[12]) + "</span></li>";
    var stats = [[r[2],"Working days"],[r[3],"Total trips"],[r[4],"On-time"],[r[5],"MG days"],[r[6],"Double MG days"]];
    var st = stats.map(function (s) { return '<div class="stat"><b>' + esc(s[0]) + "</b><span>" + s[1] + "</span></div>"; }).join("");
    result.innerHTML =
      '<div class="slip show">' +
        '<div class="who"><h2>' + esc(r[0]) + "</h2><p>Emp ID " + esc(id) + " \u2013 " + esc(CITY_NAMES[city] || city) + (r[1] ? " \u2013 " + esc(r[1]) : "") + "</p></div>" +
        '<div class="stats">' + st + "</div>" +
        '<ul class="lines">' + li + "</ul>" +
        '<div class="total"><span>Final payout</span><b>' + (Number(r[13]) < 0 ? "\u2212 " : "") + rs(r[13]) + "</b></div>" +
      "</div>" +
      '<button type="button" class="again" id="again">Check another Emp ID</button>';
    result.hidden = false;
    document.getElementById("again").addEventListener("click", function () {
      result.hidden = true; emp.value = ""; refresh(); emp.focus(); window.scrollTo(0, 0);
    });
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});
</script>
